name: Build, smoke-test and publish the GridWise image

# Builds the container in the cloud (no local Docker needed), proves it actually starts and
# answers /health as a non-root user, then publishes it to GitHub Container Registry.
# The run summary prints the exact pull command and digest to paste into README.md section 9.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gridwise

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:preli-1.0.0
            ${{ env.IMAGE }}:latest

      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          # No API key on purpose: the service must still start and serve /health without one.
          docker run --rm -d -p 8000:8000 --name gw "${IMAGE}@${{ steps.push.outputs.digest }}"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          echo "health: $(curl -fsS http://localhost:8000/health)"
          test "$(curl -fsS http://localhost:8000/health)" = '{"status":"ok"}'
          echo "runs as user: $(docker exec gw whoami)"
          test "$(docker exec gw whoami)" = "appuser"
          # A scenario must still return 200 with a valid plan even with no LLM configured.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST http://localhost:8000/optimize-energy \
                 -H 'Content-Type: application/json' -d @data/sample_request.json)
          echo "optimize-energy: HTTP $code"
          test "$code" = "200"
          python3 -c "import json;d=json.load(open('/tmp/out.json'));assert len(d['hourly_plan'])==24;print('plan hours:',len(d['hourly_plan']),'cost:',d['total_cost_bdt'])"
          # The image must carry no secret.
          docker run --rm --entrypoint sh "${IMAGE}:preli-1.0.0" -c 'env | grep -i gemini && exit 1 || echo "no secret in image env"'
          docker stop gw

      - name: Write the README snippet to the run summary
        run: |
          {
            echo "## Docker fallback — paste into README.md section 9"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:preli-1.0.0"
            echo "# digest: ${IMAGE}@${{ steps.push.outputs.digest }}"
            echo "docker run --rm -d -p 8000:8000 -e GEMINI_API_KEY=\"\$GEMINI_API_KEY\" ${IMAGE}:preli-1.0.0"
            echo '```'
            echo
            echo "Make the package public: repo → Packages → gridwise → Package settings → Change visibility → Public."
          } >> "$GITHUB_STEP_SUMMARY"
